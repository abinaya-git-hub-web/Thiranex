[theme]
base = "light"
primaryColor = "#6D28D9"
backgroundColor = "#F8F7FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F1B2D"
font = "sans serif"

[server]
headless = true
address = "0.0.0.0"
port = 8501
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 500

[browser]
gatherUsageStats = false
