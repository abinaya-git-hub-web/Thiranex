<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="thiranex-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Logo Mark Hexagon Dynamic Core -->
  <g transform="translate(15, 10)">
    <!-- Outer Hex Glow -->
    <path d="M 50 10 L 85 30 L 85 70 L 50 90 L 15 70 L 15 30 Z" fill="none" stroke="url(#thiranex-grad)" stroke-width="4" filter="url(#glow)"/>
    <!-- Dynamic Chevron Arrows (Ascending Revenue Symbol) -->
    <path d="M 32 65 L 50 45 L 68 65" fill="none" stroke="url(#thiranex-grad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 40 40 L 50 30 L 60 40" fill="none" stroke="#EC4899" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Glowing Center Accent Node -->
    <circle cx="50" cy="55" r="4" fill="#06B6D4" />
  </g>

  <!-- Brand Text -->
  <text x="120" y="62" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="38" fill="url(#text-grad)" letter-spacing="1">THIRANEX</text>
  <text x="120" y="88" font-family="'Inter', sans-serif" font-weight="600" font-size="15" fill="#8B5CF6" letter-spacing="6">SOLUTIONS</text>
</svg>
